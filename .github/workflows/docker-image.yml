name: Docker ARM64 Debug Build

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: write

env:
  REGISTRY: hrcosmo.azurecr.io
  IMAGE_NAME: hrcosmo-analytics
  PLATFORM: linux/arm64

jobs:

  # ==========================================================
  # JOB 1: TEST FRONTEND
  # ==========================================================

  test-frontend:

    name: Test Frontend Build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend
        run: |
          mkdir -p build-logs

          docker buildx build \
            --target frontend-builder \
            --platform linux/amd64 \
            --progress=plain \
            --build-arg skip_frontend_build=true \
            . \
            2>&1 | tee build-logs/frontend.log


  # ==========================================================
  # JOB 2: TEST PYTHON BASE
  # ==========================================================

  test-python-base:

    name: Test Python Base

    runs-on: ubuntu-latest

    needs: test-frontend

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python Base
        run: |
          mkdir -p build-logs

          docker buildx build \
            --target python-base \
            --platform linux/arm64 \
            --progress=plain \
            . \
            2>&1 | tee build-logs/python-base.log


  # ==========================================================
  # JOB 3: TEST PYTHON DEPENDENCIES
  # ==========================================================

  test-python-dependencies:

    name: Test Python Dependencies

    runs-on: ubuntu-latest

    needs: test-python-base

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # BUILD PYTHON DEPENDENCIES
      # ------------------------------------------------------

      - name: Test Python Dependencies
        id: python_dependencies
        shell: bash
        run: |
          mkdir -p build-logs

          set +e
          set -o pipefail

          docker buildx build \
            --target python-dependencies \
            --platform linux/arm64 \
            --progress=plain \
            --no-cache \
            . \
            2>&1 | tee build-logs/python-dependencies-error.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "Build status: $BUILD_STATUS"

          exit $BUILD_STATUS


      # ------------------------------------------------------
      # UPLOAD ERROR LOG
      # ------------------------------------------------------

      - name: Upload Python Dependency Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependencies-error-log
          path: build-logs/python-dependencies-error.log
          retention-days: 30


      # ------------------------------------------------------
      # COMMIT ERROR LOG TO MASTER BRANCH
      # ------------------------------------------------------

      - name: Save Error Log to Repository
        if: failure() && github.ref == 'refs/heads/master'
        shell: bash
        run: |

          mkdir -p debug-logs

          cp build-logs/python-dependencies-error.log \
            debug-logs/python-dependencies-error.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add debug-logs/python-dependencies-error.log

          git commit -m "debug: save ARM64 Python dependency build error" || true

          git push


  # ==========================================================
  # JOB 4: FINAL BUILD AND PUSH
  # ==========================================================

  build-and-push:

    name: Build and Push ARM64 Image

    runs-on: ubuntu-latest

    needs:
      - test-frontend
      - test-python-base
      - test-python-dependencies

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
          docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ARM64 Image
        uses: docker/build-push-action@v6

        with:
          context: .
          file: ./Dockerfile

          platforms: linux/arm64

          push: true

          target: production

          tags: |
            hrcosmo.azurecr.io/hrcosmo-analytics:arm64
            hrcosmo.azurecr.io/hrcosmo-analytics:latest

          cache-from: type=gha

          cache-to: type=gha,mode=max