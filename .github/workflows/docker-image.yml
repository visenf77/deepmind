
name: Build and Upload Redash ARM64 Image to S3

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: cg-tele-folder-parm

  # Docker image configuration
  IMAGE_NAME: hrcosmo-analytics
  IMAGE_TAG: aws-arm64

  # S3 configuration
  S3_IMAGE_PATH: ec2-docker-image
  OLD_IMAGE_PATH: ec2-docker-image/old-image

jobs:
  build-and-upload:
    name: Build and Upload Redash ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug OIDC Repository Identity
        run: |
          echo "================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Workflow: $GITHUB_WORKFLOW_REF"
          echo "================================"

      # ==========================================
      # VERIFY AWS ROLE
      # ==========================================

      - name: Verify AWS Role Configuration
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail

          if [ -z "$ROLE_ARN" ]; then
            echo "ERROR: AWS_ROLE_TO_ASSUME is empty"
            exit 1
          fi

          echo "AWS role configuration found."
          printf '%s' "$ROLE_ARN" | sha256sum

      # ==========================================
      # AWS LOGIN USING OIDC
      # ==========================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # ==========================================
      # VERIFY AWS IDENTITY
      # ==========================================

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ==========================================
      # SETUP DOCKER BUILDX
      # ==========================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # BUILD ARM64 DOCKER IMAGE
      # ==========================================

      - name: Build ARM64 Docker Image
        run: |
          set -euo pipefail

          docker buildx build \
            --progress=plain \
            --platform linux/arm64 \
            --target production \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            --cache-from type=gha,scope=redash-arm64 \
            --cache-to type=gha,scope=redash-arm64,mode=max \
            --output "type=docker,dest=/tmp/${IMAGE_NAME}-arm64.tar" \
            -f Dockerfile \
            .

      # ==========================================
      # VERIFY DOCKER IMAGE
      # ==========================================

      - name: Verify Docker Image
        run: |
          set -euo pipefail

          IMAGE_TAR="/tmp/${IMAGE_NAME}-arm64.tar"

          if [ ! -s "$IMAGE_TAR" ]; then
            echo "ERROR: Docker image TAR was not generated!"
            exit 1
          fi

          ls -lh "$IMAGE_TAR"

          docker load -i "$IMAGE_TAR"

          ARCH=$(docker image inspect \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format '{{.Os}}/{{.Architecture}}')

          echo "Image architecture: ${ARCH}"

          if [ "$ARCH" != "linux/arm64" ]; then
            echo "ERROR: Incorrect Docker image architecture!"
            exit 1
          fi

          echo "Docker image verified successfully."

      # ==========================================
      # ARCHIVE PREVIOUS IMAGE
      # ==========================================

      - name: Archive Previous Image to old-image
        run: |
          set -euo pipefail

          IMAGE_FILE="${IMAGE_NAME}-arm64.tar"
          SOURCE_KEY="${S3_IMAGE_PATH}/${IMAGE_FILE}"

          if aws s3api head-object \
            --bucket "$S3_BUCKET" \
            --key "$SOURCE_KEY" \
            >/dev/null 2>&1
          then

            TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)

            OLD_FILE="${IMAGE_NAME}-arm64-${TIMESTAMP}.tar"

            echo "Previous image found."
            echo "Moving previous image to old-image folder..."

            aws s3 mv \
              "s3://${S3_BUCKET}/${SOURCE_KEY}" \
              "s3://${S3_BUCKET}/${OLD_IMAGE_PATH}/${OLD_FILE}" \
              --only-show-errors

            echo "Previous image archived: ${OLD_FILE}"

          else

            echo "No previous image found. Skipping archive."

          fi

      # ==========================================
      # UPLOAD NEW IMAGE TO S3
      # ==========================================

      - name: Upload Docker Image to S3
        run: |
          set -euo pipefail

          aws s3 cp \
            "/tmp/${IMAGE_NAME}-arm64.tar" \
            "s3://${S3_BUCKET}/${S3_IMAGE_PATH}/${IMAGE_NAME}-arm64.tar" \
            --only-show-errors

          echo "Docker image uploaded successfully."

      # ==========================================
      # VERIFY S3 UPLOAD
      # ==========================================

      - name: Verify S3 Upload
        run: |
          set -euo pipefail

          aws s3api head-object \
            --bucket "${S3_BUCKET}" \
            --key "${S3_IMAGE_PATH}/${IMAGE_NAME}-arm64.tar" \
            --query '{ContentLength:ContentLength,LastModified:LastModified}' \
            --output table

          echo ""
          echo "SUCCESS: Redash ARM64 Docker image uploaded."

          echo "Current image:"
          aws s3 ls \
            "s3://${S3_BUCKET}/${S3_IMAGE_PATH}/${IMAGE_NAME}-arm64.tar"

          echo ""
          echo "Archived images:"
          aws s3 ls \
            "s3://${S3_BUCKET}/${OLD_IMAGE_PATH}/"
